services:
  # ── LATROCORE Backend Web Service (FastAPI) ──
  - type: web
    name: latrocore-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_ORIGIN_REGEX
        value: '^https:\/\/.*\.vercel\.app$|^https:\/\/.*\.railway\.app$|^https:\/\/.*\.onrender\.com$'
      - key: DATABASE_URL
        fromDatabase:
          name: latrocore-db
          property: connectionString

  # ── LATROCORE Frontend Static Site (React + Vite SPA) ──
  - type: web
    name: latrocore-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: latrocore-backend
          property: host

databases:
  # ── LATROCORE Persistent PostgreSQL Database (Free Tier) ──
  - name: latrocore-db
    plan: free
    region: oregon
    databaseName: latrocore
    user: latrocore
